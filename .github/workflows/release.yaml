name: Release

on:
  push:
    branches: [main]
  # Manual dry run of the desktop job: builds the app, zips it and prints the
  # cask, without uploading or pushing anything.
  workflow_dispatch:
    inputs:
      dry_run:
        description: Build the desktop zip and print the cask; never upload or push
        type: boolean
        default: true

permissions:
  contents: write

# One release at a time; a push that lands mid-release queues instead of racing the tag.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    outputs:
      release: ${{ steps.version.outputs.release }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: stable

      - name: Install svu
        run: go install github.com/caarlos0/svu/v3@v3.4.1

      # svu reads the Conventional Commits since the latest tag. --v0 keeps a
      # breaking change from jumping 0.x to 1.0.0 by accident; it has no effect
      # once the project is at v1.
      - name: Compute next version
        id: version
        run: |
          current="$(svu current)"
          next="$(svu next --v0)"
          echo "current=$current next=$next"
          if [ "$current" = "$next" ]; then
            echo "release=false" >> "$GITHUB_OUTPUT"
            echo "No releasable commits since $current."
          else
            echo "release=true" >> "$GITHUB_OUTPUT"
            echo "tag=$next" >> "$GITHUB_OUTPUT"
          fi

      - name: Tag
        if: steps.version.outputs.release == 'true'
        run: |
          git tag "${{ steps.version.outputs.tag }}"
          git push origin "${{ steps.version.outputs.tag }}"

      - name: Release
        if: steps.version.outputs.release == 'true'
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7
        with:
          distribution: goreleaser-pro
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # GoReleaser Pro license key.
          GORELEASER_KEY: ${{ secrets.GORELEASER_KEY }}
          # Fine-grained PAT with contents:write on mavogel/homebrew-tap.
          HOMEBREW_TAP_GITHUB_TOKEN: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}

  # Builds the universal macOS app, attaches its zip to the release and pushes
  # the kirokit-desktop cask. A manual dispatch builds HEAD and only prints.
  desktop:
    needs: release
    if: always() && (needs.release.outputs.release == 'true' || github.event_name == 'workflow_dispatch')
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          # The new tag on a release; HEAD of the dispatched ref on a dry run.
          ref: ${{ github.event_name == 'push' && needs.release.outputs.tag || github.sha }}

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: stable

      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: lts/*

      - name: Install Task
        run: go install github.com/go-task/task/v3/cmd/task@v3.54.0

      - name: Build
        env:
          VERSION: ${{ github.event_name == 'push' && needs.release.outputs.tag || '0.0.0-dryrun' }}
        run: task desktop:build

      - name: Zip the app and print the cask (dry run)
        if: github.event_name == 'workflow_dispatch'
        run: |
          bash scripts/desktop-release.sh --version 0.0.0-dryrun --app desktop/build/bin/kirokit.app --out "$RUNNER_TEMP/desktop-release"
          cat "$RUNNER_TEMP/desktop-release/Casks/kirokit-desktop.rb"

      - name: Upload the zip and push the cask
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Fine-grained PAT with contents:write on mavogel/homebrew-tap.
          HOMEBREW_TAP_GITHUB_TOKEN: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}
          TAG: ${{ needs.release.outputs.tag }}
        run: bash scripts/desktop-release.sh --version "$TAG" --app desktop/build/bin/kirokit.app --out "$RUNNER_TEMP/desktop-release" --publish
