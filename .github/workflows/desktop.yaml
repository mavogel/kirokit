name: Desktop

on:
  pull_request:
    paths:
      - "desktop/**"
      - "cmd/**"
      - "internal/**"
      - "go.mod"
      - "go.sum"
      - "Taskfile.yml"
      - ".goreleaser.yaml"
      - "scripts/**"
      - ".github/workflows/desktop.yaml"
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  # Tests, builds and starts the app on each OS it ships for. On pull requests
  # with the GoReleaser Pro key, it also runs this OS's part of the release as a
  # snapshot (publishes nothing), and on Linux installs the built packages.
  desktop:
    name: desktop (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # Ubuntu 24.04: the oldest system the Linux app supports, as in the release.
        os: [ubuntu-24.04, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    env:
      # GoReleaser Pro license key; empty on fork pull requests, which skips the snapshot.
      GORELEASER_KEY: ${{ secrets.GORELEASER_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: stable

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: lts/*

      - name: Install Task
        run: go install github.com/go-task/task/v3/cmd/task@v3.54.0

      # GTK 4 / WebKitGTK 6.0 to build the app, xvfb for its smoke start.
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libgtk-4-dev libwebkitgtk-6.0-dev xvfb

      # makensis builds the Windows setup .exe.
      - name: Install NSIS
        if: runner.os == 'Windows'
        run: |
          choco install nsis --no-progress -y
          echo "C:\\Program Files (x86)\\NSIS" >> "$GITHUB_PATH"

      - name: Test
        run: task desktop:test

      - name: Build
        run: task desktop:build

      # The built app quits with 0 once its page has loaded and answered a call
      # to Go (smoke:ready after State), 1 after a minute without. On Linux the
      # .deb's AppArmor profile is loaded for this build's path first: Ubuntu
      # 24.04 lets WebKit's sandbox create user namespaces only under it.
      - name: Smoke start
        timeout-minutes: 5
        env:
          KIROKIT_DESKTOP_SMOKE: "1"
        run: |
          case "$RUNNER_OS" in
            macOS) desktop/build/bin/kirokit.app/Contents/MacOS/kirokit ;;
            Linux)
              app="$PWD/desktop/build/bin/kirokit-desktop"
              sed "s#^profile kirokit-desktop /usr/bin/kirokit-desktop #profile kirokit-desktop-build $app #" \
                desktop/build/linux/apparmor/kirokit-desktop | sudo apparmor_parser --replace
              xvfb-run -a "$app" ;;
            Windows) "desktop/build/bin/kirokit-desktop-$(go env GOARCH).exe" ;;
          esac

      # The new setup program installs over the last release's: the same folder,
      # the new files, and one entry in Apps & Features.
      - name: Install over the last release (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          # Only "no release yet" skips the check; a failing gh (sign-in, network) fails it.
          $latest = gh release list --repo $env:GITHUB_REPOSITORY --exclude-drafts --exclude-pre-releases --limit 1 --json tagName --jq '.[0].tagName'
          if ($LASTEXITCODE -ne 0) { throw 'gh release list failed' }
          if (-not $latest) {
            Write-Output '::notice::No release yet; the upgrade check is skipped.'
            exit 0
          }
          $names = gh release view $latest --repo $env:GITHUB_REPOSITORY --json assets --jq '.assets[].name'
          if ($LASTEXITCODE -ne 0) { throw "gh release view $latest failed" }
          $old = $names | Where-Object { $_ -like 'kirokit-desktop_*_windows_amd64-setup.exe' } | Select-Object -First 1
          if (-not $old) {
            Write-Output "::notice::Release $latest has no Windows setup program; the upgrade check is skipped."
            exit 0
          }
          $dl = Join-Path $env:RUNNER_TEMP 'last-release'
          gh release download --repo $env:GITHUB_REPOSITORY --pattern $old --dir $dl
          if ($LASTEXITCODE -ne 0) { throw "could not download $old" }
          $new = Get-ChildItem 'desktop/build/bin/installers/*_windows_amd64-setup.exe' | Select-Object -First 1
          foreach ($setup in @((Join-Path $dl $old), $new.FullName)) {
            Write-Output "installing $setup"
            $p = Start-Process -FilePath $setup -ArgumentList '/S' -Wait -PassThru
            if ($p.ExitCode -ne 0) { throw "$setup exited $($p.ExitCode)" }
          }

          $dir = 'C:\Program Files\mavogel\kirokit'
          foreach ($pair in @(
              @("$dir\kirokit-desktop.exe", 'desktop/build/bin/kirokit-desktop-amd64.exe'),
              @("$dir\bin\kirokit.exe", 'desktop/build/bin/cli/windows_amd64/kirokit.exe'))) {
            $installed = (Get-FileHash $pair[0]).Hash
            $built = (Get-FileHash $pair[1]).Hash
            if ($installed -ne $built) { throw "$($pair[0]) is not the new build ($($pair[1]))" }
          }

          $entries = @(
            'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Uninstall\*',
            'HKLM:\SOFTWARE\WOW6432Node\Microsoft\Windows\CurrentVersion\Uninstall\*',
            'HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\*'
          ) | ForEach-Object { Get-ItemProperty $_ -ErrorAction SilentlyContinue } |
            Where-Object { "$($_.DisplayName) $($_.InstallLocation) $($_.UninstallString)" -match 'kirokit' }
          $entries | ForEach-Object { Write-Output "uninstall entry: $($_.PSChildName) ($($_.DisplayName))" }
          if ($entries.Count -ne 1 -or $entries[0].PSChildName -ne 'mavogelkirokit') {
            throw "want exactly one uninstall entry, mavogelkirokit; found $($entries.Count)"
          }

      # Early feedback on the release config, on pull requests only: this OS's
      # part of the Release workflow's split build, as a snapshot that publishes
      # nothing. A push to main is the Release workflow's own run.
      - name: Stage the app for GoReleaser
        if: github.event_name == 'pull_request' && env.GORELEASER_KEY != ''
        run: scripts/desktop-prebuilt.sh

      - name: Release snapshot (this OS)
        if: github.event_name == 'pull_request' && env.GORELEASER_KEY != ''
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7
        with:
          distribution: goreleaser-pro
          version: "~> v2"
          args: release --snapshot --clean --split
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_TAP_GITHUB_TOKEN: unused-in-a-snapshot
          SCOOP_BUCKET_GITHUB_TOKEN: unused-in-a-snapshot
          # Only the amd64 Linux app is built here; the release builds arm64 on its own runner.
          KIROKIT_SKIP_LINUX_ARM64_APP: "1"

      - name: List the snapshot
        if: github.event_name == 'pull_request' && env.GORELEASER_KEY != ''
        run: find dist -maxdepth 2 -type f \( -name '*.tar.gz' -o -name '*.zip' -o -name '*.deb' -o -name '*.rpm' -o -name '*.dmg' -o -name '*.exe' -o -name '*.json' -o -name '*.rb' \) | sort

      # The packages install on a stock Ubuntu with only the dependencies they
      # declare, their postinstall loads the AppArmor profile, and the installed
      # app starts under it.
      - name: Install the Linux packages and start the app
        if: runner.os == 'Linux' && github.event_name == 'pull_request' && env.GORELEASER_KEY != ''
        env:
          KIROKIT_DESKTOP_SMOKE: "1"
        run: |
          sudo apt-get install -y "$(find "$PWD/dist" -name 'kirokit_*_linux_amd64.deb' | head -1)" \
            "$(find "$PWD/dist" -name 'kirokit-desktop_*_linux_amd64.deb' | head -1)"
          kirokit --version
          test -x /usr/lib/kirokit-desktop/kirokit
          test -f /etc/apparmor.d/kirokit-desktop
          # Loaded profiles are listed as "<name> (<mode>)".
          sudo grep -q '^kirokit-desktop (' /sys/kernel/security/apparmor/profiles
          xvfb-run -a /usr/bin/kirokit-desktop

  # The Linux app built on Ubuntu 24.04 starts on each system the docs list, with
  # only the libraries its .deb declares. Each runs as a regular user in a
  # container that allows the namespaces WebKitGTK 6.0's sandbox needs (a
  # desktop session has them; Docker's defaults and the runner's AppArmor
  # user-namespace rule do not; the desktop job above checks the AppArmor
  # profile itself). Debian 12 is not listed: its GTK 4.8 is older than the
  # 4.14 Wails v3 needs.
  linux-distros:
    name: linux-distros (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: stable

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: lts/*

      - name: Install Task
        run: go install github.com/go-task/task/v3/cmd/task@v3.54.0

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libgtk-4-dev libwebkitgtk-6.0-dev

      - name: Build
        run: task desktop:build

      - name: Start the app on each supported system
        run: |
          deps="$(yq '.nfpms[] | select(.id == "kirokit-desktop") | .overrides.deb.dependencies[]' .goreleaser.yaml | xargs)"
          echo "the .deb declares: $deps"
          # Only for this throwaway runner: AppArmor profiles cannot reach a
          # path inside a container, so the runner's user-namespace rule is lifted.
          if [ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
          for image in ubuntu:24.04 ubuntu:26.04 debian:13; do
            echo "::group::$image"
            docker run --rm --security-opt seccomp=unconfined --security-opt systempaths=unconfined \
              --security-opt apparmor=unconfined \
              -e DEPS="$deps" -v "$PWD/desktop/build/bin:/app:ro" "$image" bash -euc '
                export DEBIAN_FRONTEND=noninteractive
                apt-get update -qq
                apt-get install -y -qq --no-install-recommends $DEPS xvfb xauth >/dev/null
                useradd -m tester
                su tester -c "cd && KIROKIT_DESKTOP_SMOKE=1 xvfb-run -a /app/kirokit-desktop"'
            echo "$image: the app started"
            echo "::endgroup::"
          done
