version: "3"

tasks:
  build:
    desc: Build the kirokit binary
    cmds:
      - go build -o kirokit ./cmd/kirokit

  vet:
    desc: Run go vet
    cmds:
      - go vet ./...

  lint:
    desc: Run golangci-lint
    cmds:
      - golangci-lint run

  test:
    desc: Run the Go test suite (includes golden-file comparisons)
    cmds:
      - go test ./... -v

  ci:
    desc: Run the same checks as CI (build, vet, lint, test)
    cmds:
      - task: build
      - task: vet
      - task: lint
      - task: test

  desktop:test:
    desc: Build the desktop frontend, run its tests, then vet and test the desktop module
    cmds:
      - cd desktop/frontend && npm ci && npm run build
      - cd desktop/frontend && node --test src/
      - cd desktop && go vet ./... && go test ./...

  desktop:dev:
    desc: Open the desktop app in Wails dev mode (Wails v2.14.0)
    cmds:
      - cd desktop && go run github.com/wailsapp/wails/v2/cmd/wails@v2.14.0 dev

  desktop:build:
    desc: Build desktop/build/bin/kirokit.app (universal, macOS 13 or later)
    env:
      CGO_CFLAGS: -mmacosx-version-min=13.0
      CGO_LDFLAGS: -mmacosx-version-min=13.0
    cmds:
      - cd desktop && go run github.com/wailsapp/wails/v2/cmd/wails@v2.14.0 build -platform darwin/universal -clean
