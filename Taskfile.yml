version: "3"

tasks:
  build:
    desc: Build the kirokit binary
    cmds:
      - go build -o kirokit ./cmd/kirokit

  vet:
    desc: Run go vet
    cmds:
      - go vet ./...

  lint:
    desc: Run golangci-lint
    cmds:
      - golangci-lint run

  test:
    desc: Run the Go test suite (includes golden-file comparisons)
    cmds:
      - go test ./... -v

  ci:
    desc: Run the same checks as CI (build, vet, lint, test)
    cmds:
      - task: build
      - task: vet
      - task: lint
      - task: test

  desktop:test:
    desc: Build the desktop frontend, run its tests, then vet and test the desktop module
    cmds:
      - cd desktop/frontend && npm ci && npm run build
      - cd desktop/frontend && node --test "src/**/*.test.js"
      - cd desktop && go vet ./... && go test ./...

  desktop:dev:
    desc: Open the desktop app in Wails dev mode (CLI version pinned by desktop/go.mod)
    cmds:
      - go build -o desktop/build/dev-bin/kirokit ./cmd/kirokit
      - cd desktop && go tool wails dev

  desktop:build:
    desc: Build the desktop app for this OS with the CLI bundled (macOS kirokit.app, universal, 13 or later; Linux kirokit-desktop; Windows setup .exe per arch); VERSION overrides git describe
    cmds:
      # through bash, so Windows (Git Bash) runs it too
      - bash scripts/desktop-build.sh

  showcase:
    desc: Record the README showcase (assets/kirokit-showcase.gif and .mp4) from the real CLI and app
    cmds:
      - scripts/showcase/record.sh
