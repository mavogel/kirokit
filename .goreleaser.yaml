version: 2

project_name: kirokit

before:
  hooks:
    - go mod tidy

builds:
  - id: kirokit
    main: ./cmd/kirokit
    binary: kirokit
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
      - linux
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X github.com/mavogel/kirokit/cmd/kirokit/commands.version={{ .Version }}
      - -X github.com/mavogel/kirokit/cmd/kirokit/commands.commit={{ .Commit }}
      - -X github.com/mavogel/kirokit/cmd/kirokit/commands.date={{ .Date }}

archives:
  - id: default
    ids:
      - kirokit
    formats:
      - tar.gz
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"

checksum:
  name_template: "checksums.txt"

changelog:
  use: github
  sort: asc
  groups:
    - title: Features
      regexp: '^.*?feat(\([[:word:]]+\))??!?:.+$'
      order: 0
    - title: Bug fixes
      regexp: '^.*?fix(\([[:word:]]+\))??!?:.+$'
      order: 1
    - title: Others
      order: 999
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"

homebrew_casks:
  - name: kirokit
    repository:
      owner: mavogel
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
    homepage: https://github.com/mavogel/kirokit
    description: Render, test, and install multi-team Kiro CLI v3 configs
    # The binaries are not notarized; without this macOS reports "kirokit is damaged".
    hooks:
      post:
        install: |
          if OS.mac?
            system_command "/usr/bin/xattr",
                           args: ["-dr", "com.apple.quarantine", "#{staged_path}/kirokit"]
          end

release:
  github:
    owner: mavogel
    name: kirokit
  mode: append
