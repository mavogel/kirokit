version: 2

# The release runs as one split job per OS (macOS, Linux, Windows), because the
# desktop app builds natively on each; `goreleaser continue --merge` then
# publishes everything together (see .github/workflows/release.yaml).
partial:
  by: goos

project_name: kirokit

before:
  hooks:
    - go mod tidy

builds:
  - id: kirokit
    main: ./cmd/kirokit
    binary: kirokit
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
      - linux
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X github.com/mavogel/kirokit/cmd/kirokit/commands.version={{ .Version }}
      - -X github.com/mavogel/kirokit/cmd/kirokit/commands.commit={{ .Commit }}
      - -X github.com/mavogel/kirokit/cmd/kirokit/commands.date={{ .Date }}

  # The Wails desktop app is built by `task desktop:build`; scripts/desktop-prebuilt.sh
  # stages its universal binary once per architecture, because a cask only
  # takes DMGs labelled amd64 or arm64.
  - id: kirokit-desktop-bin
    builder: prebuilt
    binary: kirokit
    goos:
      - darwin
    goarch:
      - amd64
      - arm64
    prebuilt:
      path: desktop/build/bin/prebuilt/kirokit_{{ .Os }}_{{ .Arch }}/kirokit

  # The Linux app, built natively per architecture (scripts/desktop-build.sh on
  # ubuntu-latest and ubuntu-24.04-arm) and staged by scripts/desktop-prebuilt.sh.
  # A pull-request snapshot builds only amd64, so it sets
  # KIROKIT_SKIP_LINUX_ARM64_APP to leave arm64 out.
  - id: kirokit-desktop-linux-amd64
    builder: prebuilt
    binary: kirokit-desktop
    goos:
      - linux
    goarch:
      - amd64
    prebuilt:
      path: desktop/build/bin/prebuilt/kirokit-desktop_linux_amd64/kirokit-desktop

  - id: kirokit-desktop-linux-arm64
    builder: prebuilt
    binary: kirokit-desktop
    skip: '{{ isEnvSet "KIROKIT_SKIP_LINUX_ARM64_APP" }}'
    goos:
      - linux
    goarch:
      - arm64
    prebuilt:
      path: desktop/build/bin/prebuilt/kirokit-desktop_linux_arm64/kirokit-desktop

# Wraps the universal binary in kirokit.app. The Wails Info.plist, icon and the
# bundled CLI come from the built app, so the bundle matches `task desktop:build`.
app_bundles:
  - id: kirokit-desktop
    ids:
      - kirokit-desktop-bin
    name: kirokit
    bundle: io.github.mavogel.kirokit
    extra_files:
      - src: desktop/build/bin/prebuilt/bundle/Contents/Info.plist
        dst: Contents/Info.plist
      - src: desktop/build/bin/prebuilt/bundle/Contents/Resources/iconfile.icns
        dst: Contents/Resources/iconfile.icns
      - src: desktop/build/bin/prebuilt/bundle/Contents/Resources/bin/kirokit
        dst: Contents/Resources/bin/kirokit

dmg:
  - id: kirokit-desktop
    ids:
      - kirokit-desktop
    use: appbundle
    replace: true
    name: "kirokit-desktop_{{ .Version }}_darwin_{{ .Arch }}"

archives:
  - id: default
    ids:
      - kirokit
    formats:
      - tar.gz
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats:
          - zip

# Linux packages: the CLI at /usr/bin/kirokit, and the app at
# /usr/bin/kirokit-desktop with its own CLI copy in /usr/lib/kirokit-desktop
# (where the app looks for it), a menu entry and an icon.
nfpms:
  - id: kirokit
    ids:
      - kirokit
    package_name: kirokit
    file_name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    formats:
      - deb
      - rpm
    vendor: mavogel
    homepage: https://github.com/mavogel/kirokit
    maintainer: Manuel Vogel <8409778+mavogel@users.noreply.github.com>
    description: Render, test, and install multi-team Kiro CLI v3 configs
    license: Apache-2.0
    bindir: /usr/bin

  - id: kirokit-desktop
    ids:
      - kirokit-desktop-linux-amd64
      - kirokit-desktop-linux-arm64
    package_name: kirokit-desktop
    file_name_template: "kirokit-desktop_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    formats:
      - deb
      - rpm
    vendor: mavogel
    homepage: https://github.com/mavogel/kirokit
    maintainer: Manuel Vogel <8409778+mavogel@users.noreply.github.com>
    description: Desktop app to install and sync Kiro CLI team configs
    license: Apache-2.0
    bindir: /usr/bin
    contents:
      - src: "desktop/build/bin/prebuilt/kirokit-desktop_linux_{{ .Arch }}/kirokit"
        dst: /usr/lib/kirokit-desktop/kirokit
        file_info:
          mode: 0755
      - src: desktop/build/linux/kirokit-desktop.desktop
        dst: /usr/share/applications/kirokit-desktop.desktop
      - src: desktop/build/linux/kirokit-desktop.png
        dst: /usr/share/icons/hicolor/512x512/apps/kirokit-desktop.png
    # WebKitGTK 4.1: Ubuntu 22.04+, Debian 12+, Fedora 40+.
    overrides:
      deb:
        dependencies:
          - libgtk-3-0
          - libwebkit2gtk-4.1-0
      rpm:
        dependencies:
          - gtk3
          - webkit2gtk4.1

# `scoop install kirokit` from mavogel/scoop-bucket: the CLI's Windows zips.
# Without the token (a fork, or the secret removed) the upload is skipped
# rather than failing a release that is already tagged.
scoops:
  - name: kirokit
    ids:
      - default
    repository:
      owner: mavogel
      name: scoop-bucket
      token: "{{ .Env.SCOOP_BUCKET_GITHUB_TOKEN }}"
    skip_upload: '{{ if isEnvSet "SCOOP_BUCKET_GITHUB_TOKEN" }}false{{ else }}true{{ end }}'
    homepage: https://github.com/mavogel/kirokit
    description: Render, test, and install multi-team Kiro CLI v3 configs
    license: Apache-2.0

checksum:
  name_template: "checksums.txt"

changelog:
  use: github
  sort: asc
  groups:
    - title: Features
      regexp: '^.*?feat(\([[:word:]]+\))??!?:.+$'
      order: 0
    - title: Bug fixes
      regexp: '^.*?fix(\([[:word:]]+\))??!?:.+$'
      order: 1
    - title: Others
      order: 999
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"

homebrew_casks:
  - name: kirokit
    ids:
      - default
    repository:
      owner: mavogel
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
    homepage: https://github.com/mavogel/kirokit
    description: Render, test, and install multi-team Kiro CLI v3 configs
    # The binaries are not notarized; without this macOS reports "kirokit is damaged".
    # custom_block, because GoReleaser's `hooks` still renders the deprecated
    # `postflight`; move to `hooks.post.install_steps` once a release supports it.
    custom_block: |
      postflight_steps do
        on_macos do
          run "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "{{ "{{staged_path}}" }}/kirokit"]
        end
      end

  - name: kirokit-desktop
    ids:
      - kirokit-desktop
    app: kirokit.app
    repository:
      owner: mavogel
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
    homepage: https://github.com/mavogel/kirokit
    description: Desktop app to install and sync Kiro CLI team configs
    # The app is not notarized; without this macOS reports "kirokit is damaged".
    # custom_block for the same reason as the kirokit cask above.
    custom_block: |
      postflight_steps do
        run "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "{{ "{{appdir}}" }}/kirokit.app"]
      end

release:
  github:
    owner: mavogel
    name: kirokit
  mode: append
  # The Windows app's setup programs, built by scripts/desktop-build.sh on the
  # Windows runner and handed to the merge job.
  extra_files:
    - glob: ./desktop/build/bin/installers/*-setup.exe
