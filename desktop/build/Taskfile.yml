# Tasks every OS's Taskfile shares. The page calls Go by name through
# frontend/src/api.js, so no bindings are generated.
version: '3'

tasks:
  install:frontend:deps:
    summary: Install frontend dependencies
    run: once
    dir: frontend
    sources:
      - package.json
      - package-lock.json
    generates:
      - node_modules
    preconditions:
      - sh: npm version
        msg: "Looks like npm isn't installed. Npm is part of the Node installer: https://nodejs.org/en/download/"
    cmds:
      - npm install

  build:frontend:
    summary: Build the frontend project
    # The universal macOS build runs its per-arch builds in parallel; build the page once.
    run: once
    dir: frontend
    sources:
      - "**/*"
      - exclude: node_modules/**/*
      - exclude: dist/**/*
    generates:
      - dist/**/*
    deps:
      - task: install:frontend:deps
    cmds:
      - npm run build -q

  # Wails' dev proxy dials 127.0.0.1; vite alone may bind only [::1].
  dev:frontend:
    summary: Runs the frontend in development mode
    deps:
      - task: install:frontend:deps
    dir: frontend
    cmds:
      - npm run dev -- --host 127.0.0.1 --port {{.VITE_PORT}} --strictPort
